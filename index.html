<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bất ngờ cho Em</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    #btn {
      padding: 20px 40px;
      font-size: 24px;
      border: none;
      border-radius: 12px;
      background: #ff4b5c;
      color: white;
      cursor: pointer;
      z-index: 2;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    #card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #ff4b5c;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: transform 0.7s ease;
      z-index: 3;
    }
    #card.show {
      transform: translate(-50%, -50%) scale(1);
    }
    .flower {
      position: absolute;
      width: 24px;
      height: 24px;
      background: url('https://cdn-icons-png.flaticon.com/512/616/616408.png') no-repeat center/cover;
      animation: fall 6s linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <button id="btn">💖 Ấn vào đây 💖</button>
  <div id="card">Anh Yêu Em! 💕</div>

  <script>
    const btn = document.getElementById('btn');
    const card = document.getElementById('card');
    let started = false;

    btn.addEventListener('click', () => {
      btn.style.display = 'none';
      card.classList.add('show');
      started = true;
      createFlowers();
      setInterval(createFlowers, 500);
    });

    function createFlowers() {
      if (!started) return;
      const flower = document.createElement('div');
      flower.className = 'flower';
      flower.style.left = Math.random() * window.innerWidth + 'px';
      flower.style.animationDuration = 4 + Math.random() * 4 + 's';
      document.body.appendChild(flower);
      setTimeout(() => flower.remove(), 8000);
    }
  </script>
</body>
</html>
