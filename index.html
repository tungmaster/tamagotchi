<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>PixelGotchi</title>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1220">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PixelGotchi">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">PIXELGOTCHI</div>
      <div class="clock" id="clock">00:00</div>
    </header>

    <main class="screen-wrap">
      <div class="screen" id="screen">
        <canvas id="lcd" width="32" height="32" aria-label="pixel screen"></canvas>
      </div>

      <section class="stats">
        <div class="meter"><span>Đói</span><div class="bar"><div id="bar-hunger"></div></div></div>
        <div class="meter"><span>Vui</span><div class="bar"><div id="bar-happy"></div></div></div>
        <div class="meter"><span>Sạch</span><div class="bar"><div id="bar-clean"></div></div></div>
        <div class="meter"><span>Sức khoẻ</span><div class="bar"><div id="bar-health"></div></div></div>
        <div class="meter"><span>Năng lượng</span><div class="bar"><div id="bar-energy"></div></div></div>
      </section>

      <section class="actions">
        <button class="btn" id="btn-feed">🍗</button>
        <button class="btn warn" id="btn-clean">🧻</button>
        <button class="btn med" id="btn-med">💉</button>
        <button class="btn" id="btn-lights">💡</button>
        <button class="btn" id="btn-sleep">😴</button>
        <button class="btn" id="btn-play">🎮</button>
      </section>

      <section class="meta">
        <div class="row">
          <div>Giai đoạn: <b id="stage">Trứng</b></div>
          <div class="small">Tuổi: <span id="age">0</span>d</div>
        </div>
        <div class="row between">
          <div class="small">💩 <span id="poops">0</span></div>
          <button class="reset" id="btn-reset">Reset</button>
        </div>
      </section>
    </main>

    <footer class="hint small">
      Thêm vào Màn hình chính để chơi như app • Lưu tự động • Hỗ trợ offline
    </footer>
  </div>
  <script>
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
